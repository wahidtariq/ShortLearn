name: ShortLearn
options:
  bundleIdPrefix: com.wahidtariq.shortlearn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ShortLearn:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShortLearn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wahidtariq.shortlearn
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ShortLearn/Info.plist
        ENABLE_PREVIEWS: "YES"
        DEVELOPMENT_ASSET_PATHS: '"ShortLearn/Preview Content"'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ShortLearnTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShortLearnTests
    dependencies:
      - target: ShortLearn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wahidtariq.shortlearn.tests
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ShortLearn.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ShortLearn"
